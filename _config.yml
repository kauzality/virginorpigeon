title: "Virgin or Pigeon"
description: "Technoshamanism, 5GW, Cyberpunk, 93/93, Thelema"
# Appended after the site title on the home page's <title> by jekyll-seo-tag.
tagline: "Technoshamanism, 5GW, Cyberpunk, 93/93, Thelema"

# Web3Forms access key for the /contact/ form. This is a public client-side key
# (it ships in the page HTML by design), not a secret. Submissions are delivered
# to the email registered with this key at web3forms.com.
web3forms_key: "de764be4-4350-4631-bc53-b8d02be79f64"
url: "https://virginorpigeon.net"
baseurl: ""

# Builds run in UTC on Cloudflare Pages; pin it so local builds match production.
timezone: America/New_York

# Flat slugs, matching the pre-Jekyll WordPress URLs. Do not reintroduce
# :categories here — it expands to *every* category in a post's front matter,
# which produced six-level URLs and broke every inbound and internal link.
permalink: /:slug/

collections:
  pages:
    output: true
    permalink: /:path/

defaults:
  # Site-wide default OpenGraph/Twitter image for any page that doesn't set its
  # own `image:` (e.g. the home page, archives). jekyll-seo-tag reads page.image;
  # pages with their own image override this.
  - scope:
      path: ""
    values:
      image: "/assets/images/TheBackdrop.webp"
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: pages
    values:
      layout: page

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate-v2

pagination:
  enabled: true
  per_page: 10
  permalink: '/page/:num/'
  title: ':title - page :num'
  sort_field: 'date'
  sort_reverse: true

# Category and tag archives. The navigation has always linked to /category/<name>/,
# but these pages were never generated because autopages was left disabled.
autopages:
  enabled: true
  categories:
    enabled: true
    layouts: ['archive.html']
    title: 'Category: :cat'
    permalink: '/category/:cat/'
    slugify:
      mode: 'raw'
      cased: true
  tags:
    enabled: true
    layouts: ['archive.html']
    title: 'Tagged: :tag'
    permalink: '/tag/:tag/'
    slugify:
      mode: 'raw'
      cased: true
  collections:
    enabled: false

# Music Video menu is hidden for now. Flip to true to bring it back.
show_music_nav: false

# Gallery menu is visible.
show_gallery_nav: true

sass:
  style: compressed

# Jekyll skips underscore-prefixed files by default, but Cloudflare Pages
# requires _redirects at the root of the build output.
include:
  - _redirects
  - _headers

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - SITE_AUDIT.md
  - _config.yml.bak
  # Cloudflare Pages reads functions/ from the project root, not the build
  # output, so keep it out of _site.
  - functions
